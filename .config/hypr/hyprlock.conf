source = ~/.config/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/arts/twilight.png
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 294, 294
    rounding = -1
    outline_thickness = 7
    inner_color = $bg_dim
    outer_color = $surface
    check_color = $accent
    fail_color = $urgent
    font_color = $text
    fade_on_empty = false
    placeholder_text =
    position = 0, -100
    halign = center
    valign = center
}
