source = ~/.config/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/arts/moon.png
}

label {
    monitor =
    text = $TIME
    color = $text
    font_family = Bebas Neue
    font_size = 180
    shadow_passes = 2
    shadow_size = 6
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = $subtext1
    font_family = Dosis Light
    font_size = 24
    shadow_passes = 2
    shadow_size = 4
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = -1
    outline_thickness = 2
    inner_color = $bg_dim
    outer_color = $accent_dim $mauve_dim 45deg
    check_color = $accent $sky 45deg
    fail_color = $urgent
    capslock_color = $warn
    font_color = $text
    font_family = Dosis
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text = <i>locked</i>
    fail_text = $FAIL
    shadow_passes = 2
    shadow_size = 6
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $overlay2
    font_family = Dosis Medium
    font_size = 14
    position = 0, 40
    halign = center
    valign = bottom
}
