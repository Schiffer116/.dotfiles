setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

set -g base-index 1
set -g mouse
set renumber-windows on

# plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Colours come from the Palette (nix/home/theme.nix).
source-file ~/.config/theme/tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

resurrect_dir="$HOME/.config/tmux/resurrect"
set -g @resurrect-dir $resurrect_dir

run '~/.config/tmux/plugins/tpm/tpm'

# Room for long session names; truncate the name itself to 20 chars with an ellipsis.
set -g status-left-length 40
set -g status-left "#[fg=#{@bg},bg=#{@accent},bold] #{=/20/…:session_name} #[fg=#{@accent},bg=#{@bg},nobold,noitalics,nounderscore]"
