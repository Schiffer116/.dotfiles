# Suspend to s2idle instead of deep S3: deep sleep on this laptop randomly resets it ~30s in.
# Install a copy, not a symlink, like logind.conf.d/lid.conf.
# Re-run after editing (systemd-sleep rereads it on every suspend): sudo install -Dm644 ~/.dotfiles/system/sleep.conf.d/s2idle.conf /etc/systemd/sleep.conf.d/s2idle.conf
[Sleep]
MemorySleepMode=s2idle
