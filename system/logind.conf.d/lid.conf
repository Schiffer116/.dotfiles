# Closing the lid never suspends: the laptop doubles as a headless home server.
# Hyprland turns the panel off instead (.config/hypr/hyprland.lua).
# Install a copy, not a symlink: logind runs with ProtectHome=yes and cannot read ~/.dotfiles.
# Re-run after editing: sudo install -Dm644 ~/.dotfiles/system/logind.conf.d/lid.conf /etc/systemd/logind.conf.d/lid.conf && sudo systemctl kill -s HUP systemd-logind
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
