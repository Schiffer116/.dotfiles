# Keep boot [OK] lines and stray output off tuigreet's tty1.
# Type=idle waits for boot jobs to finish printing before the greeter starts.
#   sudo install -Dm644 ~/.dotfiles/system/greetd/greetd.service.d/quiet-tty.conf /etc/systemd/system/greetd.service.d/quiet-tty.conf
[Service]
Type=idle
StandardInput=tty
StandardOutput=tty
StandardError=journal
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
